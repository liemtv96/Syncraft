name: Release

on:
  workflow_run:
    workflows:
      - Publish Python distributions
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          TAG_NAME="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" 'v*' | head -n 1)"
          if [ -z "$TAG_NAME" ]; then
            echo "No v* tag found for commit ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package version from tag
        run: |
          PACKAGE_VERSION="$(python scripts/resolve_release_version.py "${{ steps.tag.outputs.tag_name }}" --write-files)"
          echo "Building package version $PACKAGE_VERSION from tag ${{ steps.tag.outputs.tag_name }}"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*
