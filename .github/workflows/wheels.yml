name: Publish Python distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-build:
    name: Verify successful main build
    runs-on: ubuntu-latest

    steps:
      - name: Confirm Build workflow passed on main for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.sha;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                head_sha: headSha,
                status: "completed",
                per_page: 100,
              },
            );

            const buildRun = runs.find((run) =>
              run.name === "Build" &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );

            if (!buildRun) {
              core.setFailed(
                `No successful 'Build' workflow run on branch 'main' was found for commit ${headSha}. ` +
                "Push the release commit to main, wait for Build to pass, then tag that exact commit",
              );
              return;
            }

            core.info(
              `Verified Build run #${buildRun.run_number} succeeded on main for commit ${headSha}`,
            );

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: verify-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  test-testpypi:
    name: Smoke test from TestPyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package from TestPyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "syncraft==${GITHUB_REF_NAME#v}"

      - name: Smoke test CLI entry points
        run: |
          python -m syncraft --help
          syncraft --help

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test-testpypi
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
